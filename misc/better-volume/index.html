<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Volume Icon</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    height:100%;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .container{
    position:relative;
    width:96px;
    height:192px; /* 2x taller */
    overflow:hidden;
    border-radius:4px;
  }

  .bg{
    position:absolute;
    inset:0;
    background:radial-gradient(circle at 30% 20%, #b3294e, #5e2a8c 110%);
  }

  .btn-wrap{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:32px;
    height:32px;
  }

  .track{
    position:absolute;
    left:50%;
    top:50%;
    width:32px;
    height:44px;
    transform:translate(-50%,-50%);
    border-radius:16px;
    background:rgba(0,0,0,0.25);
    box-shadow:
      inset 0 3px 5px rgba(0,0,0,0.55),
      inset 0 -3px 5px rgba(0,0,0,0.55),
      inset 0 0 0 1px rgba(255,255,255,0.06);
    opacity:0;
    transition:opacity .15s ease;
    pointer-events:none;
    overflow:hidden;
  }
  .btn-wrap:hover .track,
  .btn-wrap.dragging .track{
    opacity:1;
  }
  .wave-svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
  }

  .icon-btn{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,0.28);
    border:none;
    border-radius:50%;
    overflow:hidden;
    cursor:grab;
    color:#fff;
    touch-action:none;
    user-select:none;
    transform:translateY(0px);
    transition:transform .35s cubic-bezier(.34,1.56,.64,1), background-color .15s ease, box-shadow .15s ease;
  }
  .icon-btn:hover,
  .icon-btn.dragging{
    background:rgba(0,0,0,0.7);
    box-shadow:
      inset 0 2px 4px rgba(0,0,0,0.6),
      inset 0 -1px 2px rgba(255,255,255,0.08);
  }
  .icon-btn.dragging{
    cursor:grabbing;
    transition:background-color .15s ease, box-shadow .15s ease; /* transform snaps instantly while dragging */
  }
  .icon-btn svg{width:22px;height:22px;pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));position:relative;}
  .icon-btn svg .wave{opacity:0;transition:opacity .15s ease;}
  .icon-btn svg .wave.on{opacity:1;}
  .icon-btn svg .mute-x{opacity:0;transition:opacity .15s ease;}
  .icon-btn.muted svg .mute-x{opacity:1;}
</style>
</head>
<body>

<div class="container">
  <div class="bg"></div>
  <div class="btn-wrap" id="btnWrap">
    <div class="track">
      <svg class="wave-svg" id="waveSvg" viewBox="0 0 32 44" preserveAspectRatio="none">
        <path id="wavePath" fill="rgba(255,255,255,0.3)"/>
      </svg>
    </div>
    <button class="icon-btn" id="volumeBtn" aria-label="Volume">
      <svg viewBox="0 0 24 24" fill="none">
        <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" d="M4 9.5Q3 9.5 3 10.5V13.5Q3 14.5 4 14.5H6.3L10.6 18.3Q11.6 19.1 11.6 17.8V6.2Q11.6 4.9 10.6 5.7L6.3 9.5Z"/>
        <path class="wave" id="wave1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M14.17 8.94 A4 4 0 0 1 14.17 15.06"/>
        <path class="wave" id="wave2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M15.78 7.02 A6.5 6.5 0 0 1 15.78 16.98"/>
        <path class="wave" id="wave3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M17.39 5.11 A9 9 0 0 1 17.39 18.89"/>
        <path class="mute-x" id="muteX" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M15.5 9.8L19.9 14.2M19.9 9.8L15.5 14.2"/>
      </svg>
    </button>
  </div>
</div>

<script>
  const btn = document.getElementById('volumeBtn');
  const btnWrap = document.getElementById('btnWrap');
  const wave1 = document.getElementById('wave1');
  const wave2 = document.getElementById('wave2');
  const wave3 = document.getElementById('wave3');
  const wavePath = document.getElementById('wavePath');
  const nudgeMax = 6; // px, how far the button itself can push up/down
  const maxRate = 60; // % per second, at full push

  // wavy fill in the track
  const TRACK_W = 32;
  const TRACK_H = 44;
  const WAVE_LEN = 32; // one full wave across the track width
  const BASE_AMP = 1;
  const DRAG_AMP = 2.4;
  let phase = 0;

  let level = 20; // percent
  let dragging = false;
  let startY = 0;
  let currentNudge = 0; // -nudgeMax..nudgeMax, driven by actual button position
  let rafId = null;
  let lastTime = 0;
  let moved = false;
  let lastNonZeroLevel = level;
  const moveThreshold = 4; // px, below this counts as a click not a drag

  function setLevel(v){
    level = Math.min(100, Math.max(0, v));
    if(level > 0) lastNonZeroLevel = level;
    btn.classList.toggle('muted', level === 0);
    wave1.classList.toggle('on', level > 0);
    wave2.classList.toggle('on', level > 33);
    wave3.classList.toggle('on', level > 66);
  }

  function tick(time){
    if(!dragging) return;
    if(lastTime){
      const dt = (time - lastTime) / 1000;
      const rate = (currentNudge / nudgeMax) * maxRate; // signed
      setLevel(level + rate * dt);
    }
    lastTime = time;
    rafId = requestAnimationFrame(tick);
  }

  function onDown(e){
    dragging = true;
    moved = false;
    btn.classList.add('dragging');
    btnWrap.classList.add('dragging');
    document.body.style.cursor = 'grabbing';
    startY = (e.touches ? e.touches[0].clientY : e.clientY);
    lastTime = 0;
    rafId = requestAnimationFrame(tick);
    e.preventDefault();
  }

  function onMove(e){
    if(!dragging) return;
    const y = (e.touches ? e.touches[0].clientY : e.clientY);
    const deltaPx = startY - y; // up = positive
    if(Math.abs(deltaPx) > moveThreshold) moved = true;
    currentNudge = Math.max(-nudgeMax, Math.min(nudgeMax, deltaPx));
    btn.style.transform = `translateY(${-currentNudge}px)`;
  }

  function onUp(){
    dragging = false;
    currentNudge = 0;
    if(rafId) cancelAnimationFrame(rafId);
    btn.classList.remove('dragging');
    btnWrap.classList.remove('dragging');
    document.body.style.cursor = '';
    btn.style.transform = 'translateY(0px)';

    if(!moved){
      toggleMute();
    }
  }

  function toggleMute(){
    if(level > 0){
      lastNonZeroLevel = level;
      setLevel(0);
    } else {
      setLevel(lastNonZeroLevel || 20);
    }
  }

  function updateWavePath(){
    const amplitude = dragging ? DRAG_AMP : BASE_AMP;
    const baselineY = TRACK_H - (level / 100) * TRACK_H;
    let d = `M0,${TRACK_H} L0,${baselineY.toFixed(2)}`;
    for(let x = 0; x <= TRACK_W; x += 2){
      const y = baselineY + amplitude * Math.sin((x / WAVE_LEN) * 2 * Math.PI + phase);
      d += ` L${x},${y.toFixed(2)}`;
    }
    d += ` L${TRACK_W},${TRACK_H} Z`;
    wavePath.setAttribute('d', d);
  }

  function waveLoop(){
    phase += dragging ? 0.22 : 0.08;
    updateWavePath();
    requestAnimationFrame(waveLoop);
  }

  btn.addEventListener('mousedown', onDown);
  btn.addEventListener('touchstart', onDown, {passive:false});
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove, {passive:false});
  window.addEventListener('mouseup', onUp);
  window.addEventListener('touchend', onUp);

  setLevel(level);
  requestAnimationFrame(waveLoop);
</script>

</body>
</html>
